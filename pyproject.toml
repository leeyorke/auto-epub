[project]
name = "auto-epub"
version = "1.2.2"
description = "基于 pydantic-ai 的 EPUB 电子书多语言翻译工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4==4.12.0",
    "ebooklib==0.19",
    "pydantic-ai>=1.43.0",
    "ruff>=0.14.13",
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
default = true

[tool.uv.pip]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
